plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

configurations {
    l2LibraryDeobf
}

dependencies {
    compileOnly project(":common")
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    implementation(jarJar('io.github.llamalad7:mixinextras-forge:0.4.1'))
    compileOnly "top.theillusivec4.curios:curios-forge:${curios_version}:api"
    compileOnly "org.jetbrains:annotations:24.1.0"
    compileOnly "dev.latvian.mods:kubejs-forge:${kubejs_version}"
    compileOnly "dev.latvian.mods:rhino-forge:${rhino_version}"
    compileOnly "dev.architectury:architectury-forge:${architectury_version}"
    compileOnly "curse.maven:ftb-quests-forge-289412:${ftb_quests_forge_version}"
    compileOnly "curse.maven:ftb-library-forge-404465:${ftb_library_forge_version}"
    compileOnly "curse.maven:questlog-1202066:${questlog_forge_version}"
    l2LibraryDeobf "curse.maven:l2library-620203:${l2library_version}"
    compileOnly "curse.maven:l2library-620203:${l2library_version}"
    compileOnly files(layout.buildDirectory.file("l2tabs/l2tabs-0.3.3.jar")) {
        builtBy 'extractL2TabsJar'
    }
    compileOnly "curse.maven:tetra-289712:${tetra_version}"
    compileOnly "curse.maven:tetra-351914:${mutil_version}"
    compileOnly "curse.maven:timeless-and-classics-zero-1028108:${tacz_version}"
    compileOnly "curse.maven:vics-point-blank-961053:${pointblank_version}"
    compileOnly "curse.maven:mrcrayfishs-gun-mod-unofficial-945471:${crayfish_gun_version}"
    compileOnly "curse.maven:scorched-guns-802940:${scorched_guns_version}"
    modCompileOnly "io.redspace:irons_spellbooks:${irons_spellbooks_version}"
    compileOnly "maven.modrinth:better-combat:${better_combat_version}"
    modRuntimeOnly "maven.modrinth:better-combat:${better_combat_version}"
    // ============================================================
    // Apothic Attributes
    // ============================================================
    modRuntimeOnly "dev.shadowsoffire:Placebo:1.20.1-${placebo_version}"
    modRuntimeOnly "dev.shadowsoffire:ApothicAttributes:1.20.1-1.3.7"

    // ============================================================
    // Iron's Spells 'n Spellbooks
    // Versions aligned with MartialSpells
    // ============================================================
    modRuntimeOnly "io.redspace:irons_lib:${irons_lib_version}"
    modRuntimeOnly "io.redspace:irons_spellbooks:${irons_spellbooks_version}"

    modRuntimeOnly "software.bernie.geckolib:geckolib-forge-1.20.1:${geckolib_version}"
    modRuntimeOnly "top.theillusivec4.curios:curios-forge:${curios_version}"
    modRuntimeOnly "dev.kosmx.player-anim:player-animation-lib-forge:1.0.2-rc1+1.20"
    modRuntimeOnly "top.theillusivec4.caelus:caelus-forge:3.1.0+1.20"

    // ============================================================
    // Shared Simply-series libraries
    // ============================================================
    modRuntimeOnly "dev.architectury:architectury-forge:${architectury_version}"
    modRuntimeOnly "curse.maven:cloth-config-348521:${cloth_config_file}"
    modRuntimeOnly "curse.maven:kotlin-for-forge-351264:${kotlin_for_forge_file}"

    // ============================================================
    // Simply Swords and Simply More
    // ============================================================
    modRuntimeOnly "curse.maven:simply-swords-659887:${simply_swords_file}"
    modRuntimeOnly "curse.maven:simply-more-1095252:${simply_more_file}"

    // ============================================================
    // Simply Bows and required libraries
    // ============================================================
    modRuntimeOnly "curse.maven:fzzy-config-1005914:${fzzy_config_file}"
    modRuntimeOnly "curse.maven:simply-tooltips-1475755:${simply_tooltips_file}"
    modRuntimeOnly "curse.maven:simply-bows-1475770:${simply_bows_file}"

}

compileJava {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

javadoc {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

tasks.register('extractL2TabsJar', Copy) {
    from({ configurations.l2LibraryDeobf.collect { zipTree(it) } })
    include 'META-INF/jarjar/l2tabs-*.jar'
    into layout.buildDirectory.dir('l2tabs')
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.forge.mixins.json"
        ])
    }
    finalizedBy('reobfJar')
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies that the Forge release JAR uses production runtime mappings.'
    dependsOn('reobfJar')

    def releaseJar = layout.buildDirectory.file(
            "libs/${mod_id}-forge-${minecraft_version}-${project.version}.jar")
    inputs.file(releaseJar)

    doLast {
        def jarFile = releaseJar.get().asFile
        def classPath = 'com/seniors/justlevelingfork/config/conditions/EntityKilledCondition.class'
        def zipFile = new java.util.zip.ZipFile(jarFile)

        try {
            def classEntry = zipFile.getEntry(classPath)
            if (classEntry == null) {
                throw new GradleException("Missing ${classPath} in ${jarFile.name}")
            }

            def classBytes = zipFile.getInputStream(classEntry).withCloseable { it.bytes }
            def constantPool = new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            logger.lifecycle(
                    "Verifying ${jarFile}: Mojmap=${constantPool.contains('ENTITY_KILLED')}, " +
                            "SRG=${constantPool.contains('f_12986_')}")

            if (constantPool.contains('ENTITY_KILLED') || !constantPool.contains('f_12986_')) {
                throw new GradleException(
                        "${jarFile.name} is not reobfuscated for the Forge production runtime")
            }
        } finally {
            zipFile.close()
        }
    }
}
