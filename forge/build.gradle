    // ============================================================
    modRuntimeOnly "curse.maven:simply-swords-659887:${simply_swords_file}"
    modRuntimeOnly "curse.maven:simply-more-1095252:${simply_more_file}"

    // ============================================================
    // Simply Bows and required libraries
    // ============================================================
    modRuntimeOnly "curse.maven:fzzy-config-1005914:${fzzy_config_file}"
    modRuntimeOnly "curse.maven:simply-tooltips-1475755:${simply_tooltips_file}"
    modRuntimeOnly "curse.maven:simply-bows-1475770:${simply_bows_file}"

    // ============================================================
    // Martial Spells
    // ============================================================
    modCompileOnly "com.w0of26:martial_spells:${martial_spells_version}"
    modRuntimeOnly "com.w0of26:martial_spells:${martial_spells_version}"

    // Martial Spells required runtime dependencies
    modRuntimeOnly "net.fabric_extras:RangedWeaponAPI-Forge:${ranged_weapon_api_version}:slim"
    modRuntimeOnly "curse.maven:turtlebois-core-library-1086765:${turtlecore_file}"

    modRuntimeOnly "maven.modrinth:mk0Htq87:${runiclib_version}-forge,${minecraft_version}"

    modRuntimeOnly "curse.maven:mob-player-animator-1058791:${mob_player_animator_file}"

}

// Critical Strike's production mixin selectors are SRG strings, but its config has no refmap.
// Supply an empty refmap only to named development runs; release jars still use the official mod.
def criticalStrikeDevJar = layout.buildDirectory.file(
        "critical-strike-dev/critical-strike-${critical_strike_version}-dev.jar")
def criticalStrikeNamedJar = providers.provider {
    def matches = tasks.named('compileJava').get().classpath.files.findAll {
        it.name == "ilvNBzFn-${critical_strike_version}.jar"
    }
    if (matches.size() != 1) {
        throw new GradleException("Expected one remapped Critical Strike compile jar, found ${matches.size()}: ${matches}")
    }
    matches.first()
}

def prepareCriticalStrikeDevJar = tasks.register('prepareCriticalStrikeDevJar') {
    inputs.file(criticalStrikeNamedJar)
    outputs.file(criticalStrikeDevJar)

    doLast {
        def outputFile = criticalStrikeDevJar.get().asFile
        outputFile.parentFile.mkdirs()
        def sourceJar = new java.util.zip.ZipFile(criticalStrikeNamedJar.get())
        try {
            def output = new java.util.zip.ZipOutputStream(new FileOutputStream(outputFile))
            try {
                def entries = sourceJar.entries()
                boolean foundMixinConfig = false
                while (entries.hasMoreElements()) {
                    def entry = entries.nextElement()
                    if (entry.name == 'critical_strike.mixins.json') {
                        foundMixinConfig = true
                        def configEntry = new java.util.zip.ZipEntry(entry.name)
                        configEntry.time = entry.time
                        output.putNextEntry(configEntry)
                        def config = sourceJar.getInputStream(entry).withCloseable { input ->
                            new groovy.json.JsonSlurper().parse(input)
                        }
                        if (config.containsKey('refmap')) {
                            throw new GradleException('Critical Strike already supplies a refmap; review the dev shim')
                        }
                        config.refmap = 'critical_strike.dev.refmap.json'
                        output.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(config))
                                .getBytes(java.nio.charset.StandardCharsets.UTF_8))
                    } else {
                        output.putNextEntry(new java.util.zip.ZipEntry(entry))
                        if (!entry.directory) {
                            sourceJar.getInputStream(entry).withCloseable { input -> input.transferTo(output) }
                        }
                    }
                    output.closeEntry()
                }
                if (!foundMixinConfig) {
                    throw new GradleException('Critical Strike mixin config is missing from the remapped jar')
                }
                def refmapEntry = new java.util.zip.ZipEntry('critical_strike.dev.refmap.json')
                refmapEntry.time = 315532800000L // Fixed ZIP timestamp: 1980-01-01 UTC.
                output.putNextEntry(refmapEntry)
                output.write('{"mappings":{},"data":{}}'.getBytes(java.nio.charset.StandardCharsets.UTF_8))
                output.closeEntry()
            } finally {
                output.close()
            }
        } finally {
            sourceJar.close()
        }
    }
}

dependencies {
    // Named dev jar is already remapped; load it as the Forge mod, not a legacy library.
    runtimeOnly files(prepareCriticalStrikeDevJar)
}

tasks.named('runClient') { dependsOn prepareCriticalStrikeDevJar }
tasks.named('runServer') { dependsOn prepareCriticalStrikeDevJar }

compileJava {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

javadoc {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

tasks.register('extractL2TabsJar', Copy) {
    from({ configurations.l2LibraryDeobf.collect { zipTree(it) } })
    include 'META-INF/jarjar/l2tabs-*.jar'
    into layout.buildDirectory.dir('l2tabs')
    eachFile { details -> details.path = details.name }
    includeEmptyDirs = false
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.forge.mixins.json"
        ])
    }
    finalizedBy('reobfJar')
}

tasks.register('verifyReleaseJar') {
    group = 'verification'
    description = 'Verifies that the Forge release JAR uses production runtime mappings.'
    dependsOn('reobfJar')

    def releaseJar = layout.buildDirectory.file(
            "libs/${mod_id}-forge-${minecraft_version}-${project.version}.jar")
    inputs.file(releaseJar)

    doLast {
        def jarFile = releaseJar.get().asFile
        def classPath = 'com/seniors/justlevelingfork/config/conditions/EntityKilledCondition.class'
        def zipFile = new java.util.zip.ZipFile(jarFile)

        try {
            def classEntry = zipFile.getEntry(classPath)
            if (classEntry == null) {
                throw new GradleException("Missing ${classPath} in ${jarFile.name}")
            }

            def classBytes = zipFile.getInputStream(classEntry).withCloseable { it.bytes }
            def constantPool = new String(classBytes, java.nio.charset.StandardCharsets.ISO_8859_1)
            logger.lifecycle(
                    "Verifying ${jarFile}: Mojmap=${constantPool.contains('ENTITY_KILLED')}, " +
                            "SRG=${constantPool.contains('f_12986_')}")

            if (constantPool.contains('ENTITY_KILLED') || !constantPool.contains('f_12986_')) {
                throw new GradleException(
                        "${jarFile.name} is not reobfuscated for the Forge production runtime")
            }
        } finally {
            zipFile.close()
        }
    }
}
