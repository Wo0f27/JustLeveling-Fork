plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

import java.util.Locale

def envOrDefault = { name, fallback ->
    providers.environmentVariable(name).orElse(fallback)
}

publishMods {
    def releaseType = providers.environmentVariable('RELEASE_TYPE').orElse('release').get().toLowerCase(Locale.ROOT)
    def releaseVersion = project.version.toString()
    def forgeReleaseJar = project(':forge').layout.buildDirectory.file(
            "libs/${mod_id}-forge-${minecraft_version}-${releaseVersion}.jar")

    changelog = envOrDefault(
            'CHANGELOG',
            '''- Fixed Forge world joins failing while synchronizing aptitude commands
- Fixed /aptitudesreload clearing the item restriction registry
- Corrected the default Nether Wart restriction ID
- Hardened lock-item reloads so malformed entries are skipped without discarding valid entries''').get()
    displayName = envOrDefault(
            'RELEASE_NAME',
            "${mod_name} ${releaseVersion} for Minecraft ${minecraft_version}").get()
    version = releaseVersion
    type = releaseType == 'alpha' ? ALPHA : releaseType == 'beta' ? BETA : STABLE
    dryRun = providers.environmentVariable('DRY_RUN').map { it.toBoolean() }.orElse(false).get()

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = envOrDefault('CURSEFORGE_PROJECT_ID', '1073400')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
        clientRequired = true
        serverRequired = true
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = envOrDefault('MODRINTH_PROJECT_ID', 'LqrwcaUD')
        minecraftVersions.add(minecraft_version)
    }

    curseforge('curseforgeFabric') {
        from cfOptions
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('ftb-quests-fabric')
        optional('questlog')
    }

    curseforge('curseforgeForge') {
        from cfOptions
        file = forgeReleaseJar
        modLoaders.add('forge')
        optional('ftb-quests-forge')
        optional('questlog')
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('ftb-quests')
        optional('questlog')
    }

    modrinth('modrinthForge') {
        from mrOptions
        file = forgeReleaseJar
        modLoaders.add('forge')
        optional('ftb-quests')
        optional('questlog')
    }
}

tasks.matching { it.name in ['publishCurseforgeForge', 'publishModrinthForge'] }.configureEach {
    dependsOn project(':forge').tasks.named('verifyReleaseJar')
}
