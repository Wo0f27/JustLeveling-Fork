plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

import java.util.Locale

def envOrDefault = { name, fallback ->
    providers.environmentVariable(name).orElse(fallback)
}

publishMods {
    def releaseType = providers.environmentVariable('RELEASE_TYPE').orElse('release').get().toLowerCase(Locale.ROOT)

    changelog = envOrDefault(
            'CHANGELOG',
            '''- Fixed Forge 47.4 runtime mappings and mixin compatibility crashes
- Hardened multiplayer progression requests and live config synchronization
- Recovered malformed JSON configs and validated custom entries
- Fixed command validation, item restriction updates, and gameplay probability calculations''').get()
    displayName = envOrDefault('RELEASE_NAME', "${mod_name} ${version} for Minecraft ${minecraft_version}").get()
    version = project.version
    type = releaseType == 'alpha' ? ALPHA : releaseType == 'beta' ? BETA : STABLE
    dryRun = providers.environmentVariable('DRY_RUN').map { it.toBoolean() }.orElse(false).get()

    def cfOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = envOrDefault('CURSEFORGE_PROJECT_ID', '1073400')
        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)
    }

    def mrOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = envOrDefault('MODRINTH_PROJECT_ID', 'LqrwcaUD')
        minecraftVersions.add(minecraft_version)
    }

    curseforge('curseforgeFabric') {
        from cfOptions
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('ftb-quests-fabric')
        optional('questlog')
    }

    curseforge('curseforgeForge') {
        from cfOptions
        file project(':forge')
        modLoaders.add('forge')
        optional('ftb-quests-forge')
        optional('questlog')
    }

    modrinth('modrinthFabric') {
        from mrOptions
        file project(':fabric')
        modLoaders.add('fabric')
        requires('fabric-api')
        optional('ftb-quests')
        optional('questlog')
    }

    modrinth('modrinthForge') {
        from mrOptions
        file project(':forge')
        modLoaders.add('forge')
        optional('ftb-quests')
        optional('questlog')
    }
}
