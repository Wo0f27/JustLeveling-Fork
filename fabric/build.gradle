plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
    modCompileOnly "dev.emi:trinkets:${trinkets_version}@jar"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}"
    modCompileOnly "dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${cardinal_components_version}"
    modCompileOnly "dev.latvian.mods:kubejs-fabric:${kubejs_version}"
    modCompileOnly "dev.latvian.mods:rhino-fabric:${rhino_version}"
    modCompileOnly "dev.architectury:architectury-fabric:${architectury_version}"
    modCompileOnly "curse.maven:ftb-quests-fabric-438496:${ftb_quests_fabric_version}"
    modCompileOnly "curse.maven:ftb-library-fabric-438495:${ftb_library_fabric_version}"
    compileOnly "curse.maven:questlog-1202066:${questlog_forge_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
}

compileJava {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

javadoc {
    dependsOn project(":common").tasks.named("compileQuestlogStubJava")
    classpath += project(":common").sourceSets.questlogStub.output
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}
